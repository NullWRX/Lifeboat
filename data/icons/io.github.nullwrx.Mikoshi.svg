<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Mikoshi: a neon data shrine. A shrine gate shelters a stack of glowing data layers. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151a3a"/>
      <stop offset="1" stop-color="#05060d"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2bd6"/>
      <stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2bd6"/>
      <stop offset="0.5" stop-color="#ff5ae0"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <linearGradient id="layer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#7a5cff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="clip">
      <rect x="8" y="8" width="112" height="112" rx="26"/>
    </clipPath>
  </defs>

  <!-- tile -->
  <rect x="8" y="10" width="112" height="112" rx="26" fill="#000" opacity="0.35"/>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#tile)"/>
  <!-- faint grid -->
  <g clip-path="url(#clip)" stroke="#00e5ff" stroke-opacity="0.07" stroke-width="1">
    <path d="M8 32H120M8 56H120M8 80H120M8 104H120M32 8V120M56 8V120M80 8V120M104 8V120"/>
  </g>
  <rect x="9" y="9" width="110" height="110" rx="25" fill="none" stroke="url(#edge)" stroke-width="2" opacity="0.9"/>

  <g filter="url(#glow)">
    <!-- roof: a sweeping shrine-gate top beam -->
    <path d="M24 38 Q64 26 104 38 L100 45 Q64 35 28 45 Z" fill="url(#roof)"/>
    <!-- lintel -->
    <rect x="34" y="50" width="60" height="5" rx="1.5" fill="#00e5ff"/>
    <!-- pillars -->
    <rect x="38" y="45" width="5" height="57" rx="1.5" fill="#ff2bd6"/>
    <rect x="85" y="45" width="5" height="57" rx="1.5" fill="#ff2bd6"/>
    <!-- stacked data layers (the saved copies) -->
    <rect x="49" y="62" width="30" height="7" rx="2" fill="url(#layer)"/>
    <rect x="49" y="73" width="30" height="7" rx="2" fill="url(#layer)" opacity="0.85"/>
    <rect x="49" y="84" width="30" height="7" rx="2" fill="url(#layer)" opacity="0.7"/>
    <!-- status lights -->
    <circle cx="74.5" cy="65.5" r="1.6" fill="#f5e900"/>
    <circle cx="74.5" cy="76.5" r="1.6" fill="#f5e900"/>
    <circle cx="74.5" cy="87.5" r="1.6" fill="#00ff9c"/>
    <!-- base -->
    <rect x="30" y="102" width="68" height="3" rx="1.5" fill="#00e5ff" opacity="0.9"/>
  </g>
</svg>
